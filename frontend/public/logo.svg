<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="YottaFlex.ai">
  <defs>
    <linearGradient id="yf-tile" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.55" stop-color="#6236ec"/>
      <stop offset="1" stop-color="#3b1fa8"/>
    </linearGradient>
    <linearGradient id="yf-shine" x1="32" y1="0" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="16" fill="url(#yf-tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#yf-shine)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#fff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Y arms: debit & credit converging -->
  <path d="M20.5 17 L32 30 L43.5 17" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Y stem: stacked ledger entries -->
  <rect x="28.5" y="33.5" width="7" height="5" rx="2.5" fill="#fff"/>
  <rect x="28.5" y="40.5" width="7" height="5" rx="2.5" fill="#fff" fill-opacity="0.78"/>
  <rect x="28.5" y="47.5" width="7" height="5" rx="2.5" fill="#fff" fill-opacity="0.55"/>

  <!-- Reward spark -->
  <path d="M51 8 C51.4 10.6 52.4 11.6 55 12 C52.4 12.4 51.4 13.4 51 16 C50.6 13.4 49.6 12.4 47 12 C49.6 11.6 50.6 10.6 51 8 Z" fill="#67e8f9"/>
</svg>
